
{% extends "user_manager/layout.html" %}

{% block title %}Criar Usuário{% endblock %}

{% block content %}

<h1 class="text-center">Tema</h1>

<form method="post" class="card p-4">
    {% csrf_token %}

    <div class="mb-3">
        <label for="{{ form.name.id_for_label }}" class="form-label">
            {{ form.name.label }}
        </label>
        {{ form.name }}
        {{ form.name.errors }}
    </div>

    <div class="mb-3">
        <label for="{{ form.nickname.id_for_label }}" class="form-label">
            {{ form.nickname.label }}
        </label>
        {{ form.nickname }}
        {{ form.nickname.errors }}
    </div>

    <button class="btn btn-success align-self-start" type="submit">
        Salvar Usuário
    </button>
</form>

{% endblock content %}
