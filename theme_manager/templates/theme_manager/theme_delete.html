{% extends "theme_manager/layout.html" %}

{% block title %} Deletar Tema {% endblock %}

{% block content %}

<h1 class="text-center"> Tem certeza que quer deletar {{ theme.name }}?</h1>
<form method="post" class="text-center">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim</button>
    <a href="{% url 'theme_home' %}" class="btn btn-secondary">Não</a>
</form>

{% endblock content %}
