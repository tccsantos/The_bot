
{% extends "theme_manager/layout.html" %}

{% block title %}Criar Tema{% endblock %}

{% block content %}

<h1 class="text-center">Tema</h1>

<form method="post" class="card p-4">
    {% csrf_token %}

    <div class="mb-3">
        <label for="{{ form.name.id_for_label }}" class="form-label">
            {{ form.name.label }}
        </label>
        {{ form.name }}
        {{ form.name.errors }}
    </div>

    <div class="mb-3" style="max-height: 200px; overflow-y: auto;">
        {% for checkbox in form.user %}
            <div class="form-check">
                {{ checkbox.tag }}
                <label class="form-check-label"
                    for="{{ checkbox.id_for_label }}">
                    {{ checkbox.choice_label }}
                </label>
            </div>
        {% endfor %}
    </div>

    <div class="form-check mb-3">
        {{ form.is_padoru }}
        <label class="form-check-label"
            for="{{ form.is_padoru.id_for_label }}">
            {{ form.is_padoru.label }}
        </label>
    </div>

    <div class="form-check mb-3">
        {{ form.available }}
        <label class="form-check-label"
            for="{{ form.available.id_for_label }}">
            {{ form.available.label }}
        </label>
    </div>

    <button class="btn btn-success align-self-start" type="submit">
        Salvar Tema
    </button>
</form>

{% endblock content %}
